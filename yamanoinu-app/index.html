te attention to ordinary life.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-04",zh:"\u4F55\u304B\u3092\u3059\u308B\u3068\u304D\u306F\u3001\u81EA\u5206\u306E\u75D5\u8DE1\u3092\u6B8B\u3055\u306C\u307B\u3069\u306B\u3001\u305D\u308C\u306B\u8EAB\u3092\u3042\u305A\u3051\u308B\u3002",en:"When you do something, give yourself completely to it, without leaving a trace of yourself behind.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-05",zh:"\u5FC3\u306E\u96D1\u8349\u306B\u611F\u8B1D\u3059\u308B\u3053\u3068\u3002\u3084\u304C\u3066\u305D\u308C\u304C\u4FEE\u884C\u3092\u80A5\u3084\u3059\u3002",en:"You should be grateful for the weeds in your mind, because they eventually enrich your practice.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-06",zh:"\u5916\u306E\u4F55\u3082\u306E\u3082\u3001\u3042\u306A\u305F\u3092\u60A9\u307E\u305B\u308B\u3053\u3068\u306F\u3067\u304D\u306A\u3044\u3002\u6CE2\u3092\u7ACB\u3066\u308B\u306E\u306F\u81EA\u5206\u306E\u5FC3\u3060\u3002",en:"Nothing outside yourself can create your trouble; it is your own mind that creates the waves.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-07",zh:"\u4E0D\u5B8C\u5168\u306A\u5B58\u5728\u3092\u3068\u304A\u3057\u3066\u3001\u5B8C\u5168\u306A\u5B58\u5728\u3092\u898B\u3044\u3060\u3059\u3002",en:"We should find perfect existence through imperfect existence.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-08",zh:"\u3059\u3079\u3066\u306F\u5909\u308F\u308B\u3002\u305D\u308C\u3092\u672C\u5F53\u306B\u53D7\u3051\u5165\u308C\u305F\u3068\u304D\u3001\u5909\u5316\u306E\u306A\u304B\u3067\u843D\u3061\u7740\u3044\u3066\u3044\u3089\u308C\u308B\u3002",en:"Everything changes. When you truly accept this, you can find composure within change.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-09",zh:"\u3044\u3061\u3070\u3093\u5927\u5207\u306A\u306E\u306F\u3001\u4F55\u304C\u672C\u5F53\u306B\u5927\u5207\u304B\u3092\u898B\u3064\u3051\u308B\u3053\u3068\u3002",en:"The most important thing is to discover what is truly important.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-10",zh:"\u4FEE\u884C\u306E\u3068\u304D\u3001\u8AB0\u304B\u5225\u306E\u4EBA\u306B\u306A\u308D\u3046\u3068\u3057\u306A\u3044\u3002\u3044\u307E\u3042\u308B\u5FC3\u3067\u3001\u305F\u3060\u5750\u308B\u3002",en:"When you practice, don't try to become someone else. Simply practice with the mind you have now.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-11",zh:"\u81EA\u5206\u3092\u5916\u306E\u7269\u306E\u3088\u3046\u306B\u8ABF\u3079\u308B\u3053\u3068\u306F\u3067\u304D\u306A\u3044\u3002\u4FEE\u884C\u3092\u751F\u304D\u308B\u307B\u304B\u306A\u3044\u3002",en:"You cannot study yourself as though you were an object outside yourself; you must live the practice.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-12",zh:"\u4FEE\u884C\u306F\u5F97\u308B\u305F\u3081\u3067\u306F\u306A\u3044\u3002\u898B\u308B\u3053\u3068\u3092\u59A8\u3052\u3066\u3044\u308B\u3082\u306E\u3092\u624B\u653E\u3059\u305F\u3081\u3060\u3002",en:"Our practice is not about gaining something. It is about letting go of what prevents us from seeing clearly.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-13",zh:"\u3057\u3066\u3044\u308B\u3053\u3068\u306B\u5168\u304F\u5165\u308A\u3053\u3093\u3067\u3044\u308B\u3068\u304D\u3001\u81EA\u5206\u306E\u3053\u3068\u3092\u8003\u3048\u308B\u5FC5\u8981\u306F\u306A\u3044\u3002",en:"When you are completely involved in what you are doing, there is no need to think about yourself.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-14",zh:"\u4F55\u304B\u3092\u6271\u3046\u306B\u306F\u3001\u304D\u3064\u304F\u63E1\u308B\u3088\u308A\u3001\u3058\u3085\u3046\u3076\u3093\u306A\u5834\u6240\u3092\u4E0E\u3048\u308B\u307B\u3046\u304C\u3088\u3044\u3002",en:"The way to control something is often to give it enough space rather than trying to hold it tightly.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-15",zh:"\u3042\u308B\u7D50\u679C\u306B\u57F7\u7740\u3057\u306A\u3044\u3068\u304D\u3001\u672C\u5F53\u306E\u81EA\u7531\u304C\u3042\u308B\u3002",en:"True freedom comes when you are not attached to a particular result.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-16",zh:"\u6210\u529F\u3057\u305F\u304B\u3089\u4FEE\u884C\u3059\u308B\u306E\u3067\u306F\u306A\u3044\u3002\u307E\u305F\u59CB\u3081\u308B\u5FC3\u304C\u3042\u308B\u304B\u3089\u4FEE\u884C\u3059\u308B\u3002",en:"We practice not because we have succeeded, but because we are willing to begin again.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-17",zh:"\u4FEE\u884C\u306E\u3072\u3068\u3068\u304D\u306F\u3001\u307E\u3063\u305F\u304F\u81EA\u5206\u81EA\u8EAB\u3067\u3042\u308B\u3072\u3068\u3068\u304D\u3060\u3002",en:"A moment of practice is a moment of completely being yourself.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-18",zh:"\u5750\u308B\u3068\u304D\u3001\u9759\u304B\u306B\u306A\u308D\u3046\u3068\u3057\u306A\u3044\u3002\u305F\u3060\u5750\u308A\u3001\u9759\u3051\u3055\u3082\u4E71\u308C\u3082\u3001\u305D\u306E\u307E\u307E\u306B\u3057\u3066\u304A\u304F\u3002",en:"When you sit, don't try to become calm. Simply sit, and let calmness and disturbance be what they are.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-19",zh:"\u521D\u5FC3\u306F\u3001\u6B21\u306B\u4F55\u304C\u8D77\u3053\u308B\u304B\u3092\u77E5\u308D\u3046\u3068\u56FA\u57F7\u3057\u306A\u3044\u3002",en:"The beginner's mind does not insist on knowing what will happen next.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-20",zh:"\u81EA\u5206\u3092\u307E\u308B\u3054\u3068\u53D7\u3051\u5165\u308C\u305F\u3068\u304D\u3001\u307B\u304B\u306E\u3059\u3079\u3066\u3092\u53D7\u3051\u5165\u308C\u306F\u3058\u3081\u308B\u3002",en:"When you accept yourself completely, you can begin to accept everything else.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-21",zh:"\u3044\u306E\u3061\u306F\u3044\u3064\u3082\u4ECA\u3053\u3053\u3067\u8D77\u3053\u3063\u3066\u3044\u308B\u3002\u4FEE\u884C\u3059\u308B\u5834\u6240\u306F\u307B\u304B\u306B\u306A\u3044\u3002",en:"Our life is always happening here and now; there is nowhere else to practice.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-22",zh:"\u8003\u3048\u3092\u6D88\u305D\u3046\u3068\u3057\u306A\u3044\u3002\u8D77\u3053\u308A\u3001\u6D88\u3048\u308B\u307E\u307E\u306B\u3001\u3064\u304B\u307E\u306A\u3044\u3002",en:"Don't try to eliminate your thoughts. Let them arise and disappear without holding onto them.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-23",zh:"\u7985\u306E\u4FEE\u884C\u306F\u7D4C\u9A13\u3092\u7A4D\u3080\u3053\u3068\u3067\u306F\u306A\u304F\u3001\u3072\u3068\u3064\u3072\u3068\u3064\u306E\u7D4C\u9A13\u306B\u5168\u304F\u51FA\u4F1A\u3046\u3053\u3068\u3060\u3002",en:"The practice of Zen is not to accumulate experiences, but to meet each experience completely.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-24",zh:"\u5916\u306B\u4F55\u304B\u3092\u6C42\u3081\u308B\u306E\u3092\u3084\u3081\u305F\u3068\u304D\u3001\u4F55\u3082\u6B20\u3051\u3066\u3044\u306A\u304B\u3063\u305F\u3068\u6C17\u3065\u304F\u304B\u3082\u3057\u308C\u306A\u3044\u3002",en:"When you stop seeking something outside yourself, you may discover that nothing was missing.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-25",zh:"\u7121\u5E38\u3092\u77E5\u308B\u3044\u3061\u3070\u3093\u306E\u65B9\u6CD5\u306F\u3001\u8003\u3048\u308B\u3053\u3068\u3067\u306F\u306A\u304F\u3001\u3068\u3082\u306B\u751F\u304D\u308B\u3053\u3068\u3060\u3002",en:"The best way to understand impermanence is not merely to think about it, but to live with it.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-26",zh:"\u3088\u3044\u4FEE\u884C\u306F\u3042\u306A\u305F\u3092\u7279\u5225\u306B\u306F\u3057\u306A\u3044\u3002\u3082\u3063\u3068\u5FB9\u5E95\u3057\u3066\u5E73\u51E1\u306B\u3059\u308B\u3002",en:"A good practice does not make you special; it makes you more completely ordinary.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"},{id:"sz-27",zh:"\u521D\u5FC3\u304C\u3042\u308C\u3070\u3001\u3069\u306E\u77AC\u9593\u3082\u65B0\u3057\u3044\u3002\u671F\u5F85\u3057\u305F\u5F62\u306B\u7121\u7406\u306B\u5408\u308F\u305B\u306A\u3044\u304B\u3089\u3002",en:"When you have beginner's mind, every moment is fresh because you are not forcing it to be what you expect.",src:"after Shunryu Suzuki / \u9234\u6728\u4FCA\u9686"}],cf=Xp,gu=Jp.filter(e=>e.en&&e.en.trim()),sf=[...cf,...gu],mu="yamanoinu-state",ff=3600*1e3,yu=()=>({frog:{status:"home",awayUntil:null,leftAt:null,justReturned:!1},satchel:[],sits:[],teas:0,seen:[],placeSeed:Math.floor(Math.random()*1e9),placeDay:Bl(),lastSeen:0});function qp(e){let t=new Set(e||[]),n=gu.length&&Math.random()<.5?gu:cf,r=n.filter(o=>!t.has(o.id)),l=r.length?r:n;return l[Math.floor(Math.random()*l.length)].id}function bp(e){return new Date(e).toLocaleDateString(void 0,{day:"numeric",month:"short"})}var mr=null,Ql=null;function Vl(){return mr||(mr=new(window.AudioContext||window.webkitAudioContext)),mr.state==="suspended"&&mr.resume(),mr}function e0(){let e=Vl();if(Ql)return Ql;let t=e.createGain(),n=e.createGain();n.gain.value=.92;let r=e.createBiquadFilter();r.type="lowpass",r.frequency.value=1100;let l=e.createGain();l.gain.value=.12;let o=e.createDelay(3);o.delayTime.value=.46;let i=e.createGain();return i.gain.value=.2,t.connect(n).connect(e.destination),t.connect(r),r.connect(o),o.connect(i),i.connect(r),o.connect(l),l.connect(e.destination),Ql=t,Ql}function vn(e,t=440,n=.28,r=16){let l=Vl(),o=l.createGain();o.gain.value=n,o.connect(e0()),[[1,1,r,!1],[2,.3,r*.7,!1],[2.42,.12,r*.5,!1],[3,.06,r*.4,!1]].forEach(([f,m,g,y])=>{(y?[[0,m],[.002,m*.5]]:[[0,m]]).forEach(([x,C])=>{let T=l.createOscillator(),c=l.createGain();T.type="sine",T.frequency.value=t*f*(1+x),c.gain.setValueAtTime(1e-4,e),c.gain.exponenti
