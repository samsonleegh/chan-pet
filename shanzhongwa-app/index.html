u3001\u81EA\u5DF1\u3092\u308F\u3059\u308B\u308B\u306A\u308A\u3002",en:"To study yourself is to forget yourself.",src:"\u9053\u5143 \xB7 \u73FE\u6210\u516C\u6848"},{id:"rk",zh:"\u76D7\u4EBA\u306B\u53D6\u308A\u6B8B\u3055\u308C\u3057\u7A93\u306E\u6708",en:"The thief left it behind \u2014 the moon at the window.",src:"\u826F\u5BEC"},{id:"hs2",zh:"\u4EBA\u554F\u5BD2\u5C71\u9053\uFF0C\u5BD2\u5C71\u8DEF\u4E0D\u901A\u3002",en:"People ask the way to Cold Mountain. The road to Cold Mountain doesn't go through.",src:"\u5BD2\u5C71\u8A69"}],Xp=[{id:"sz-00a",zh:"",en:"",src:"Shunryu Suzuki, Zen Mind, Beginner's Mind"},{id:"sz-00b",zh:"",en:"",src:"Shunryu Suzuki, Zen Mind, Beginner's Mind"},{id:"sz-01",zh:"\u5FD8\u4E86\u81EA\u5DF1\uFF0C\u4FBF\u8207\u5468\u906D\u842C\u7269\u5408\u800C\u70BA\u4E00\u3002",en:"When you forget yourself, you become one with everything around you.",src:"after Shunryu Suzuki"},{id:"sz-02",zh:"\u4FEE\u884C\u4E0D\u662F\u70BA\u4E86\u5F97\u5230\u4EC0\u9EBC\uFF0C\u800C\u662F\u8B93\u771F\u5BE6\u7684\u672C\u6027\u986F\u9732\u51FA\u4F86\u3002",en:"The purpose of practice is not to attain something, but to express your true nature.",src:"after Shunryu Suzuki"},{id:"sz-03",zh:"\u79AA\u4E0D\u662F\u9003\u96E2\u5E73\u5E38\u751F\u6D3B\uFF0C\u800C\u662F\u5C0D\u5E73\u5E38\u751F\u6D3B\u7684\u5168\u7136\u5C08\u6CE8\u3002",en:"Zen is not an escape from ordinary life; it is complete attention to ordinary life.",src:"after Shunryu Suzuki"},{id:"sz-04",zh:"\u505A\u4E00\u4EF6\u4E8B\uFF0C\u5C31\u5168\u7136\u6295\u5165\uFF0C\u4E0D\u7559\u4E0B\u81EA\u5DF1\u7684\u75D5\u8DE1\u3002",en:"When you do something, give yourself completely to it, without leaving a trace of yourself behind.",src:"after Shunryu Suzuki"},{id:"sz-05",zh:"\u8981\u611F\u8B1D\u5FC3\u4E2D\u7684\u96DC\u8349\uFF0C\u5B83\u5011\u7D42\u6703\u6ECB\u990A\u4F60\u7684\u4FEE\u884C\u3002",en:"You should be grateful for the weeds in your mind, because they eventually enrich your practice.",src:"after Shunryu Suzuki"},{id:"sz-06",zh:"\u5916\u982D\u6C92\u6709\u4EC0\u9EBC\u80FD\u7D66\u4F60\u7169\u60F1\uFF1B\u8D77\u6D6A\u7684\u662F\u4F60\u81EA\u5DF1\u7684\u5FC3\u3002",en:"Nothing outside yourself can create your trouble; it is your own mind that creates the waves.",src:"after Shunryu Suzuki"},{id:"sz-07",zh:"\u8981\u5728\u4E0D\u5713\u6EFF\u7684\u5B58\u5728\u88CF\uFF0C\u627E\u5230\u5713\u6EFF\u7684\u5B58\u5728\u3002",en:"We should find perfect existence through imperfect existence.",src:"after Shunryu Suzuki"},{id:"sz-08",zh:"\u4E00\u5207\u90FD\u5728\u8B8A\u3002\u771F\u6B63\u63A5\u53D7\u9019\u4E00\u9EDE\uFF0C\u4FBF\u80FD\u5728\u8B8A\u5316\u4E2D\u5B89\u4F4F\u3002",en:"Everything changes. When you truly accept this, you can find composure within change.",src:"after Shunryu Suzuki"},{id:"sz-09",zh:"\u6700\u8981\u7DCA\u7684\uFF0C\u662F\u5F04\u6E05\u695A\u4EC0\u9EBC\u624D\u771F\u6B63\u8981\u7DCA\u3002",en:"The most important thing is to discover what is truly important.",src:"after Shunryu Suzuki"},{id:"sz-10",zh:"\u4FEE\u884C\u6642\uFF0C\u4E0D\u8981\u8A66\u8457\u8B8A\u6210\u5225\u4EBA\u3002\u5C31\u7528\u4F60\u6B64\u523B\u7684\u5FC3\u53BB\u4FEE\u3002",en:"When you practice, don't try to become someone else. Simply practice with the mind you have now.",src:"after Shunryu Suzuki"},{id:"sz-11",zh:"\u4F60\u4E0D\u80FD\u628A\u81EA\u5DF1\u7576\u4F5C\u8EAB\u5916\u7684\u4E00\u4EF6\u6771\u897F\u4F86\u7814\u7A76\uFF1B\u4F60\u5F97\u89AA\u8EAB\u6D3B\u5728\u4FEE\u884C\u88CF\u3002",en:"You cannot study yourself as though you were an object outside yourself; you must live the practice.",src:"after Shunryu Suzuki"},{id:"sz-12",zh:"\u4FEE\u884C\u4E0D\u662F\u70BA\u4E86\u7372\u5F97\uFF0C\u800C\u662F\u653E\u4E0B\u90A3\u4E9B\u906E\u4F4F\u773C\u775B\u7684\u6771\u897F\u3002",en:"Our practice is not about gaining something. It is about letting go of what prevents us from seeing clearly.",src:"after Shunryu Suzuki"},{id:"sz-13",zh:"\u5168\u5FC3\u6295\u5165\u624B\u4E0A\u7684\u4E8B\u6642\uFF0C\u5C31\u4E0D\u5FC5\u53BB\u60F3\u81EA\u5DF1\u4E86\u3002",en:"When you are completely involved in what you are doing, there is no need to think about yourself.",src:"after Shunryu Suzuki"},{id:"sz-14",zh:"\u8981\u638C\u63E1\u4E00\u6A23\u6771\u897F\uFF0C\u5F80\u5F80\u662F\u7D66\u5B83\u8DB3\u5920\u7684\u7A7A\u9593\uFF0C\u800C\u4E0D\u662F\u7DCA\u7DCA\u6293\u4F4F\u3002",en:"The way to control something is often to give it enough space rather than trying to hold it tightly.",src:"after Shunryu Suzuki"},{id:"sz-15",zh:"\u4E0D\u57F7\u8457\u65BC\u67D0\u500B\u7D50\u679C\uFF0C\u624D\u6709\u771F\u6B63\u7684\u81EA\u7531\u3002",en:"True freedom comes when you are not attached to a particular result.",src:"after Shunryu Suzuki"},{id:"sz-16",zh:"\u6211\u5011\u4FEE\u884C\uFF0C\u4E0D\u662F\u56E0\u70BA\u5DF2\u7D93\u6210\u529F\uFF0C\u800C\u662F\u56E0\u70BA\u9858\u610F\u91CD\u65B0\u958B\u59CB\u3002",en:"We practice not because we have succeeded, but because we are willing to begin again.",src:"after Shunryu Suzuki"},{id:"sz-17",zh:"\u4FEE\u884C\u7684\u6BCF\u4E00\u523B\uFF0C\u90FD\u662F\u5168\u7136\u505A\u81EA\u5DF1\u7684\u4E00\u523B\u3002",en:"A moment of practice is a moment of completely being yourself.",src:"after Shunryu Suzuki"},{id:"sz-18",zh:"\u5750\u7684\u6642\u5019\uFF0C\u4E0D\u8981\u8A66\u8457\u8B8A\u5F97\u5E73\u975C\u3002\u53EA\u7BA1\u5750\uFF0C\u8B93\u5E73\u975C\u8207\u64FE\u52D5\u5404\u662F\u5176\u6240\u662F\u3002",en:"When you sit, don't try to become calm. Simply sit, and let calmness and disturbance be what they are.",src:"after Shunryu Suzuki"},{id:"sz-19",zh:"\u521D\u5FC3\u4E0D\u5F37\u6C42\u77E5\u9053\u63A5\u4E0B\u4F86\u6703\u767C\u751F\u4EC0\u9EBC\u3002",en:"The beginner's mind does not insist on knowing what will happen next.",src:"after Shunryu Suzuki"},{id:"sz-20",zh:"\u5B8C\u5168\u63A5\u53D7\u4E86\u81EA\u5DF1\uFF0C\u624D\u958B\u59CB\u80FD\u63A5\u53D7\u5176\u4ED6\u4E00\u5207\u3002",en:"When you accept yourself completely, you can begin to accept everything else.",src:"after Shunryu Suzuki"},{id:"sz-21",zh:"\u751F\u547D\u6C38\u9060\u5728\u6B64\u6642\u6B64\u5730\u767C\u751F\uFF1B\u6C92\u6709\u5225\u7684\u5730\u65B9\u53EF\u4EE5\u4FEE\u884C\u3002",en:"Our life is always happening here and now; there is nowhere else to practice.",src:"after Shunryu Suzuki"},{id:"sz-22",zh:"\u4E0D\u8981\u8A66\u8457\u6D88\u6EC5\u5FF5\u982D\u3002\u8B93\u5B83\u5011\u751F\u8D77\u3001\u6D88\u6563\uFF0C\u4E0D\u53BB\u6293\u4F4F\u3002",en:"Don't try to eliminate your thoughts. Let them arise and disappear without holding onto them.",src:"after Shunryu Suzuki"},{id:"sz-23",zh:"\u79AA\u7684\u4FEE\u884C\u4E0D\u662F\u7D2F\u7A4D\u7D93\u9A57\uFF0C\u800C\u662F\u5B8C\u6574\u5730\u9047\u898B\u6BCF\u4E00\u6B21\u7D93\u9A57\u3002",en:"The practice of Zen is not to accumulate experiences, but to meet each experience completely.",src:"after Shunryu Suzuki"},{id:"sz-24",zh:"\u4E0D\u518D\u5411\u5916\u5C0B\u6C42\u6642\uFF0C\u4F60\u4E5F\u8A31\u6703\u767C\u73FE\uFF0C\u5F9E\u4F86\u6C92\u6709\u7F3A\u5C11\u904E\u4EC0\u9EBC\u3002",en:"When you stop seeking something outside yourself, you may discover that nothing was missing.",src:"after Shunryu Suzuki"},{id:"sz-25",zh:"\u7406\u89E3\u7121\u5E38\u6700\u597D\u7684\u65B9\u6CD5\uFF0C\u4E0D\u662F\u60F3\u5B83\uFF0C\u800C\u662F\u8207\u5B83\u4E00\u8D77\u751F\u6D3B\u3002",en:"The best way to understand impermanence is not merely to think about it, but to live with it.",src:"after Shunryu Suzuki"},{id:"sz-26",zh:"\u597D\u7684\u4FEE\u884C\u4E0D\u6703\u8B93\u4F60\u8B8A\u5F97\u7279\u5225\uFF1B\u5B83\u8B93\u4F60\u66F4\u5FB9\u5E95\u5730\u5E73\u5E38\u3002",en:"A good practice does not make you special; it makes you more completely ordinary.",src:"after Shunryu Suzuki"},{id:"sz-27",zh:"\u6709\u521D\u5FC3\uFF0C\u6BCF\u4E00\u523B\u90FD\u662F\u65B0\u7684\uFF0C\u56E0\u70BA\u4F60\u4E0D\u5F37\u8FEB\u5B83\u6210\u70BA\u4F60\u6240\u9810\u671F\u7684\u6A23\u5B50\u3002",en:"When you have beginner's mind, every moment is fresh because you are not forcing it to be what you expect.",src:"after Shunryu Suzuki"},{id:"ss-01",zh:"\u4E0D\u77E5\u9053\u6642\uFF0C\u5FC3\u662F\u6E05\u695A\u7684\u3002\u4EE5\u70BA\u77E5\u9053\u4E86\uFF0C\u5FC3\u5C31\u8907\u96DC\u8D77\u4F86\u3002",en:"When you don't know, your mind is clear. When you think you know, your mind becomes complicated.",src:"after Seung Sahn"},{id:"ss-02",zh:"\u4FDD\u6301\u4E0D\u77E5\u9053\u7684\u5FC3\uFF0C\u81EA\u5DF1\u7684\u60F3\u6CD5\u88FD\u9020\u51FA\u4F86\u7684\u554F\u984C\u5C31\u6703\u5C11\u4E00\u4E9B\u3002",en:"Keep a don't-know mind, and you will have fewer problems created by your own thinking.",src:"after Seung Sahn"},{id:"ss-03",zh:"\u5931\u53BB\u4E0D\u77E5\u9053\u7684\u5FC3\uFF0C\u5C31\u958B\u59CB\u5728\u6C92\u6709\u554F\u984C\u7684\u5730\u65B9\u88FD\u9020\u554F\u984C\u3002",en:"When you lose your don't-know mind, you begin creating problems where there were none.",src:"after Seung Sahn"},{id:"ss-04",zh:"\u554F\u81EA\u5DF1\uFF1A\u300C\u6211\u662F\u4EC0\u9EBC\uFF1F\u300D\u4E0D\u8981\u6EFF\u8DB3\u65BC\u4E00\u500B\u982D\u8166\u4E0A\u7684\u7B54\u6848\u3002",en:"Ask yourself, \u2018What am I?\u2019 and don't be satisfied with an intellectual answer.",src:"after Seung Sahn"},{id:"ss-05",zh:"\u5403\u98EF\u6642\u53EA\u7BA1\u5403\u98EF\uFF0C\u7761\u89BA\u6642\u53EA\u7BA1\u7761\u89BA\uFF0C\u505A\u4E8B\u6642\u53EA\u7BA1\u505A\u4E8B\u3002",en:"When you eat, just eat. When you sleep, just sleep. When you work, just work.",src:"after Seung Sahn"},{id:"ss-06",zh:"\u4E0D\u9020\u4F5C\uFF0C\u4E0D\u57F7\u53D6\uFF0C\u4E0D\u6392\u65A5\u3002",en:"Don't make anything. Don't cling to anything. Don't reject anything.",src:"after Seung Sahn"},{id:"ss-07",zh:"\u751F\u6C23\u6642\uFF0C\u4E0D\u8981\u8A66\u8457\u8B8A\u6210\u4E00\u500B\u4E0D\u751F\u6C23\u7684\u4EBA\u3002\u53EA\u662F\u6E05\u695A\u5730\u770B\u898B\u90A3\u500B\u6C23\u3002",en:"When you are angry, don't try to become someone who isn't angry. Just see the anger clearly.",src:"after Seung Sahn"},{id:"ss-08",zh:"\u4F60\u7684\u610F\u898B\u6703\u64CB\u4F4F\u4F60\uFF0C\u770B\u4E0D\u898B\u6B63\u5728\u767C\u751F\u7684\u4E8B\u3002",en:"Your opinions can prevent you from seeing what is actually happening.",src:"after Seung Sahn"},{id:"ss-09",zh:"\u653E\u4E0B\u4F60\u7684\u610F\u898B\uFF0C\u5FC3\u5C31\u6E05\u695A\u5F97\u8DB3\u4EE5\u770B\u898B\u773C\u524D\u7684\u8655\u5883\u3002",en:"Put down your opinions and your mind becomes clear enough to see the situation.",src:"after Seung Sahn"},{id:"ss-10",zh:"\u4E0D\u77E5\u9053\uFF0C\u4F60\u4FBF\u81EA\u7531\uFF0C\u80FD\u56DE\u61C9\u8655\u5883\uFF0C\u800C\u4E0D\u662F\u8DDF\u96A8\u81EA\u5DF1\u7684\u5047\u8A2D\u3002",en:"If you don't know, you are free to respond to the situation instead of following your assumptions.",src:"after Seung Sahn"},{id:"ss-11",zh:"\u5FC3\u6E05\u695A\u4E86\uFF0C\u8655\u5883\u5C31\u6E05\u695A\u4E86\uFF0C\u4F60\u4E5F\u5C31\u77E5\u9053\u8A72\u505A\u4EC0\u9EBC\u3002",en:"When your mind is clear, your situation is clear, and you know what to do.",src:"after Seung Sahn"},{id:"ss-12",zh:"\u4E0D\u8981\u4E0D\u505C\u5730\u6AA2\u67E5\u81EA\u5DF1\u3002\u53EA\u7BA1\u505A\u8A72\u505A\u7684\u4E8B\u3002",en:"Don't check yourself constantly. Just do what needs to be done.",src:"after Seung Sahn"},{id:"ss-13",zh:"\u6709\u4EBA\u9913\u4E86\uFF0C\u7D66\u4ED6\u5403\u7684\uFF1B\u6709\u4EBA\u6E34\u4E86\uFF0C\u7D66\u4ED6\u559D\u7684\u3002",en:"If someone is hungry, feed them. If someone is thirsty, give them something to drink.",src:"after Seung Sahn"},{id:"ss-14",zh:"\u4FEE\u884C\u7684\u76EE\u7684\uFF0C\u4E0D\u662F\u70BA\u81EA\u5DF1\u958B\u609F\uFF0C\u800C\u662F\u5E6B\u52A9\u4E00\u5207\u773E\u751F\u3002",en:"The purpose of practice is not to become enlightened for yourself, but to help all beings.",src:"after Seung Sahn"},{id:"ss-15",zh:"\u9023\u4F60\u5C0D\u79AA\u7684\u7406\u89E3\uFF0C\u4E5F\u4E0D\u8981\u57F7\u8457\u3002",en:"Don't become attached even to your understanding of Zen.",src:"after Seung Sahn"},{id:"ss-16",zh:"\u4E0D\u518D\u9020\u4F5C\u300C\u6211\u300D\u8207\u300C\u6211\u7684\u300D\uFF0C\u81EA\u5DF1\u8207\u4ED6\u4EBA\u4E4B\u9593\u7684\u9694\u95A1\u4FBF\u4E0D\u518D\u90A3\u9EBC\u5805\u5BE6\u3002",en:"When you stop making \u2018I\u2019 and \u2018my,\u2019 the separation between yourself and others becomes less solid.",src:"after Seung Sahn"},{id:"ss-17",zh:"\u4F60\u7684\u601D\u60F3\u81EA\u6210\u4E00\u500B\u4E16\u754C\uFF1B\u5225\u628A\u90A3\u500B\u4E16\u754C\u7576\u6210\u771F\u5BE6\u3002",en:"Your thinking creates a world of its own; don't confuse that world with reality.",src:"after Seung Sahn"},{id:"ss-18",zh:"\u904E\u53BB\u5DF2\u7D93\u904E\u53BB\uFF0C\u672A\u4F86\u9084\u6C92\u5230\u4F86\u3002\u6B64\u523B\u4F60\u80FD\u505A\u4EC0\u9EBC\uFF1F",en:"The past is already gone and the future has not arrived. What can you do right now?",src:"after Seung Sahn"},{id:"ss-19",zh:"\u4E0D\u8981\u4E00\u8F29\u5B50\u90FD\u5728\u6AA2\u67E5\u81EA\u5DF1\u505A\u5F97\u5C0D\u4E0D\u5C0D\u3002\u770B\u6E05\u8655\u5883\uFF0C\u7136\u5F8C\u884C\u52D5\u3002",en:"Don't spend your life checking whether you are doing the right thing. See the situation and act.",src:"after Seung Sahn"},{id:"ss-20",zh:"\u9047\u5230\u56F0\u96E3\u7684\u8655\u5883\uFF0C\u4E0D\u8981\u7528\u81EA\u5DF1\u7684\u60F3\u6CD5\u628A\u56F0\u96E3\u653E\u5927\u3002",en:"When you encounter a difficult situation, don't make the difficulty bigger with your thinking.",src:"after Seung Sahn"},{id:"ss-21",zh:"\u6E05\u695A\u7684\u5FC3\u4E0D\u662F\u6C92\u6709\u5FF5\u982D\uFF0C\u800C\u662F\u4E0D\u88AB\u5FF5\u982D\u6240\u63A7\u5236\u3002",en:"A clear mind doesn't mean having no thoughts; it means not being controlled by them.",src:"after Seung Sahn"},{id:"ss-22",zh:"\u4E0D\u8981\u8A66\u8457\u7559\u4F4F\u597D\u7684\u7D93\u9A57\uFF0C\u4E5F\u4E0D\u8981\u8A66\u8457\u63A8\u958B\u58DE\u7684\u3002",en:"Don't try to hold onto good experiences and don't try to push away bad ones.",src:"after Seung Sahn"},{id:"ss-23",zh:"\u9047\u898B\u4E00\u500B\u4EBA\u6642\uFF0C\u4E0D\u8981\u9047\u898B\u4F60\u5C0D\u4ED6\u7684\u60F3\u6CD5\u3002\u9047\u898B\u90A3\u500B\u771F\u6B63\u5728\u773C\u524D\u7684\u4EBA\u3002",en:"When you meet another person, don't meet your idea of them. Meet the person who is actually there.",src:"after Seung Sahn"},{id:"ss-24",zh:"\u770B\u898B\u4EC0\u9EBC\uFF0C\u53EA\u7BA1\u770B\u898B\uFF1B\u807D\u898B\u4EC0\u9EBC\uFF0C\u53EA\u7BA1\u807D\u898B\u3002",en:"When you see something, just see it. When you hear something, just hear it.",src:"after Seung Sahn"},{id:"ss-25",zh:"\u4E0D\u8981\u628A\u81EA\u5DF1\u5F04\u5F97\u7279\u5225\u3002\u53EA\u7BA1\u5B8C\u5168\u505A\u81EA\u5DF1\uFF0C\u5B8C\u5168\u5728\u6B64\u523B\u3002",en:"Don't make yourself special. Just be completely yourself and completely present.",src:"after Seung Sahn"},{id:"ss-26",zh:"\u57F7\u8457\u65BC\u81EA\u5DF1\u662F\u5C0D\u7684\uFF0C\u5C31\u7121\u6CD5\u5F9E\u8655\u5883\u4E2D\u5B78\u5230\u6771\u897F\u3002",en:"If you are attached to being right, you cannot learn from the situation.",src:"after Seung Sahn"},{id:"ss-27",zh:"\u4E0D\u77E5\u9053\u7684\u5FC3\uFF0C\u662F\u9858\u610F\u9047\u898B\u6BCF\u4E00\u523B\uFF0C\u800C\u4E0D\u4E8B\u5148\u8981\u6C42\u7B54\u6848\u3002",en:"Don't-know mind means being willing to meet each moment without demanding an answer beforehand.",src:"after Seung Sahn"},{id:"ss-28",zh:"\u79AA\u4E0D\u662F\u9003\u907F\u554F\u984C\uFF0C\u800C\u662F\u770B\u6E05\u8655\u5883\uFF0C\u6B63\u78BA\u5730\u56DE\u61C9\u3002",en:"Zen is not about escaping your problems; it is about seeing your situation clearly and responding correctly.",src:"after Seung Sahn"},{id:"ss-29",zh:"\u5927\u7591\u554F\u4E0D\u662F\u7528\u8A00\u8A9E\u56DE\u7B54\u7684\uFF0C\u800C\u662F\u7528\u751F\u547D\u6D3B\u51FA\u4F86\u7684\u3002",en:"The great question is not something you answer with words; it is something you live.",src:"after Seung Sahn"},{id:"ss-30",zh:"\u5E6B\u52A9\u4E00\u500B\u4EBA\u6642\uFF0C\u4E0D\u8981\u7DE8\u4E00\u500B\u81EA\u5DF1\u662F\u597D\u4EBA\u7684\u6545\u4E8B\u3002\u53EA\u7BA1\u5E6B\u3002",en:"When you help someone, don't m
